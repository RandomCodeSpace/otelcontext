<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161615">
  <meta name="description" content="Layered topology of services, their instances and the hosts they run on.">
  <title>Service map · OtelContext</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/service-map.css">
  <script src="/static/dagre.min.js"></script>
  <script type="module" src="/static/service-map.js"></script>
</head>
<body>
  <a class="skip-link" href="#canvas">Skip to service map</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="OtelContext overview"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">OtelContext</span></a>
      <span class="vr hide-sm" aria-hidden="true"></span>
      <nav class="topnav" aria-label="Primary">
        <a href="/"><svg class="ic" aria-hidden="true"><use href="/static/icons.svg#i-layout-dashboard"/></svg><span>Overview</span></a>
        <a href="/service-map" aria-current="page"><svg class="ic" aria-hidden="true"><use href="/static/icons.svg#i-waypoints"/></svg><span>Service map</span></a>
        <a href="/explorer"><svg class="ic" aria-hidden="true"><use href="/static/icons.svg#i-compass"/></svg><span>Explorer</span></a>
      </nav>
      <div class="topbar-tools">
        <label class="env-field" id="env-field"><span class="sr-only">Environment</span><select class="select" id="env"><option value="*">All environments</option></select></label>
        <div class="seg range-seg" role="group" aria-label="Time range">
          <button type="button" data-range="15m" aria-pressed="true">15m</button>
          <button type="button" data-range="1h" aria-pressed="false">1h</button>
          <button type="button" data-range="6h" aria-pressed="false">6h</button>
          <button type="button" data-range="24h" aria-pressed="false">24h</button>
        </div>
        <button class="btn btn-ghost refresh" id="refresh" type="button" aria-label="Refresh topology"><svg class="ic" aria-hidden="true"><use href="/static/icons.svg#i-refresh-cw"/></svg><span class="updated num" id="updated" aria-live="polite">Loading…</span></button>
        <span class="vr" aria-hidden="true"></span>
        <button class="btn btn-ghost btn-icon" id="theme-button" type="button" aria-label="Switch to light theme"><svg class="ic" aria-hidden="true"><use href="/static/icons.svg#i-sun"/></svg></button>
      </div>
    </header>
    <main id="main" class="smap">
      <h1 class="sr-only">Service map</h1>
      <aside class="rail" id="rail" aria-label="Layers and filters">
        <div class="rail-head">
          <h2 class="eyebrow">Layers</h2>
          <button class="btn btn-ghost btn-icon btn-sm drawer-close" type="button" data-close="rail" aria-label="Close layers"><svg class="ic" aria-hidden="true"><use href="/static/icons.svg#i-x"/></svg></button>
        </div>
        <div class="rail-scroll panel-scroll">
          <div class="rail-env" id="rail-env"></div>
          <div class="layers" id="layers"></div>
          <section class="rail-sec" aria-labelledby="domains-heading">
            <h2 class="eyebrow" id="domains-heading">Domains</h2>
            <ul class="list" id="domains"></ul>
          </section>
          <section class="rail-sec" aria-labelledby="find-heading">
            <h2 class="eyebrow" id="find-heading">Services</h2>
            <label class="field search">
              <svg class="ic ic-sm" aria-hidden="true"><use href="/static/icons.svg#i-search"/></svg>
              <span class="sr-only">Find service</span>
              <input id="search" type="search" placeholder="Find service" autocomplete="off" spellcheck="false">
              <kbd aria-hidden="true">/</kbd>
            </label>
            <ul class="list" id="results"></ul>
          </section>
        </div>
      </aside>
      <section class="stage" aria-label="Layered topology">
        <div class="stage-bar">
          <button class="btn btn-icon drawer-open rail-open" id="rail-open" type="button" aria-label="Show layers" aria-controls="rail" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="/static/icons.svg#i-layers"/></svg></button>
          <nav class="crumbs" id="crumbs" aria-label="Scope"></nav>
          <span class="spacer"></span>
          <div class="seg mode-seg" role="group" aria-label="Granularity">
            <button type="button" data-mode="services" aria-pressed="true">Services</button>
            <button type="button" data-mode="instances" aria-pressed="false">Instances</button>
          </div>
          <label class="hops" id="hops-field" hidden><span class="sr-only">Neighbour depth</span><select class="select" id="hops"><option value="1">1 hop</option><option value="2">2 hops</option></select></label>
          <div class="legend" aria-label="Legend">
            <span title="Healthy"><svg class="ic ic-xs tone-ok" aria-hidden="true"><use href="/static/icons.svg#i-circle-check"/></svg><span class="lg-t">Healthy</span></span>
            <span title="Degraded"><svg class="ic ic-xs tone-warn" aria-hidden="true"><use href="/static/icons.svg#i-triangle-alert"/></svg><span class="lg-t">Degraded</span></span>
            <span title="Critical"><svg class="ic ic-xs tone-crit" aria-hidden="true"><use href="/static/icons.svg#i-octagon-x"/></svg><span class="lg-t">Critical</span></span>
            <span title="Observed call"><i class="lg-call" aria-hidden="true"></i><span class="lg-t">call</span></span>
            <span title="Runs on host"><i class="lg-runs" aria-hidden="true"></i><span class="lg-t">runs on</span></span>
          </div>
          <button class="btn btn-icon drawer-open insp-open" id="insp-open" type="button" aria-label="Show inspector" aria-controls="inspector" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="/static/icons.svg#i-panel-right"/></svg></button>
        </div>
        <div class="canvas dot-grid" id="canvas" tabindex="0" aria-label="Topology canvas. Drag or use arrow keys to pan, plus and minus to zoom, 0 to fit." aria-describedby="canvas-help">
          <p class="sr-only" id="canvas-help">Services, instances and hosts are buttons. Enter selects, double-click focuses a service, Escape clears the selection.</p>
          <svg class="map" id="map" role="group" aria-label="Services, instances and hosts" tabindex="-1" focusable="false"></svg>
          <div class="lane-labels" id="lane-labels" aria-hidden="true"></div>
          <div class="map-state" id="map-state" hidden></div>
          <p class="map-note" id="map-note" hidden></p>
          <div class="zoom" role="group" aria-label="Zoom">
            <button class="btn btn-icon" id="zoom-out" type="button" aria-label="Zoom out"><svg class="ic" aria-hidden="true"><use href="/static/icons.svg#i-minus"/></svg></button>
            <button class="btn btn-icon" id="zoom-in" type="button" aria-label="Zoom in"><svg class="ic" aria-hidden="true"><use href="/static/icons.svg#i-plus"/></svg></button>
            <button class="btn" id="zoom-fit" type="button">Fit</button>
          </div>
        </div>
      </section>
      <aside class="inspector" id="inspector" aria-labelledby="insp-title">
        <div class="sheet-handle" aria-hidden="true"></div>
        <header class="insp-head" id="insp-head"></header>
        <div class="insp-tabs" id="insp-tabs" role="tablist" aria-label="Inspector sections">
          <button type="button" role="tab" id="tab-overview" data-tab="overview" aria-controls="insp-body" aria-selected="true">Overview</button>
          <button type="button" role="tab" id="tab-instances" data-tab="instances" aria-controls="insp-body" aria-selected="false" tabindex="-1">Instances</button>
          <button type="button" role="tab" id="tab-calls" data-tab="calls" aria-controls="insp-body" aria-selected="false" tabindex="-1">Calls</button>
        </div>
        <div class="insp-body panel-scroll" id="insp-body" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"></div>
        <footer class="insp-foot">
          <div class="insp-links" id="insp-links"></div>
          <p class="coverage" id="coverage"></p>
        </footer>
      </aside>
      <div class="scrim" id="scrim" hidden></div>
    </main>
  </div>
  <noscript>Enable JavaScript to load the service map. The JSON API is available at /api/topology/graph.</noscript>
</body>
</html>
