# GoReleaser config — release ARTIFACTS + signing for OtelContext.
# Triggered by the release workflow on a version tag push. The committed
# browser-native UI is embedded by Go in every build.
#
# OSS-only (cost $0): GoReleaser OSS v2, cosign (keyless OIDC), syft for SBOMs.
# No Pro-only keys are used. Validate locally with `goreleaser check`.
version: 2

project_name: otelcontext

builds:
  - id: otelcontext
    binary: otelcontext
    main: .
    # Pure-Go SQLite driver → no cgo; required for cross-compilation here.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{ .Tag }}

archives:
  - id: otelcontext
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE.md
      - README.md
      - src: deploy/systemd/otelcontext.service
        dst: deploy/systemd
      - src: deploy/systemd/otelcontext.env.example
        dst: deploy/systemd

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: archive-sbom
    artifacts: archive

# Sign the checksums file with cosign keyless (Sigstore OIDC). Signing the
# checksums file transitively covers every archive listed in it, so a single
# .sig + .pem pair attaches to the release and Scorecard's Signed-Releases
# check is satisfied. id-token: write must be granted to the release job.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature
      - "${signature}"
      - --output-certificate
      - "${certificate}"
      - "${artifact}"
    artifacts: checksum
    output: true

release:
  # Draft-first. GoReleaser uploads the archives, SBOMs, checksums, signature
  # and certificate to a DRAFT release and never publishes it: with `draft`
  # set, GoReleaser's publish step is a no-op. Publication is a separate job in
  # .github/workflows/release.yml that runs only after the release-candidate
  # proofs approve limited production.
  draft: true
  # scripts/release.sh --release may already have created the draft for this
  # tag (title == tag, notes, no artifacts). GitHub's get-release-by-tag lookup
  # does not return drafts, so without this GoReleaser would open a second
  # draft; with it, GoReleaser finds the existing draft by name, keeps its
  # draft state, and uploads into it. When no draft exists it creates one.
  use_existing_draft: true
  # `mode` only governs the release NOTES when the release already exists: keep
  # release.sh's notes and append GoReleaser's (empty, changelog disabled).
  mode: append
  # Mark the GitHub release as a pre-release when the tag carries a pre-release
  # identifier (e.g. v0.4.0-beta.1). Without this, append mode resets the
  # release to a full (latest) release even for beta tags.
  prerelease: auto

changelog:
  # release.sh owns the human-facing release notes; keep goreleaser's autogenerated
  # changelog out of the way so the two don't fight over the release body.
  disable: true
