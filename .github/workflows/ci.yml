name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build · vet · test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race -timeout 180s ./...

      - name: loadsim build tag compiles
        run: go build -tags loadtest ./test/loadsim/...

      # The seven-day release gate is intentionally compile-and-unit-test only
      # in CI. Its full protocol runs for hours and terminates a local process.
      - name: prefill build tag compiles
        run: go build -tags prefill ./test/aggprefill/...

      - name: gate build tag compiles
        run: go build -tags gate ./test/gate/...

      - name: gate unit tests
        run: go test -tags gate -race -timeout 60s ./test/gate/...

  browser-smoke:
    name: browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build exact browser-test binary
        run: |
          mkdir -p "${RUNNER_TEMP}/browser-smoke"
          go build -o "${RUNNER_TEMP}/browser-smoke/otelcontext" .

      - name: run protected browser workflow
        env:
          OTELCONTEXT_BINARY: ${{ runner.temp }}/browser-smoke/otelcontext
          CHROME_BIN: google-chrome
          BROWSER_SMOKE_ARTIFACTS: ${{ runner.temp }}/browser-smoke/artifacts
        run: go test -tags=browser -count=1 -timeout 150s -run '^TestProtectedBrowserWorkflow$' ./test/browser

      - name: upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/browser-smoke/artifacts
          if-no-files-found: warn
          retention-days: 14

  topology-proof:
    name: topology proof · ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, aggregate-shadow, aggregate]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: run cross-consumer topology proof
        env:
          OTELCONTEXT_TOPOLOGY_PROOF_MODE: ${{ matrix.mode }}
          OTELCONTEXT_TOPOLOGY_PROOF_DIR: ${{ runner.temp }}/topology-proof
        run: |
          set -o pipefail
          mkdir -p "${OTELCONTEXT_TOPOLOGY_PROOF_DIR}"
          go test -race -count=1 -v -run '^TestTopologyModeProof$' ./test/topologyproof 2>&1 \
            | tee "${OTELCONTEXT_TOPOLOGY_PROOF_DIR}/${OTELCONTEXT_TOPOLOGY_PROOF_MODE}.log"
          jq -e --arg mode "${OTELCONTEXT_TOPOLOGY_PROOF_MODE}" '
            .schema_version == "otelcontext.topology-proof.v1" and
            .mode == $mode and
            (.edge_set | length) == 1 and
            (.assertions | length) >= 10 and
            all(.assertions[]; .passed == true)
          ' "${OTELCONTEXT_TOPOLOGY_PROOF_DIR}/${OTELCONTEXT_TOPOLOGY_PROOF_MODE}.json"

      - name: upload mode topology proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: topology-proof-${{ matrix.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/topology-proof
          if-no-files-found: error
          retention-days: 14

  database-sqlite:
    name: database proof · sqlite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: run SQLite migration and affected-contract proof
        run: |
          mkdir -p "${RUNNER_TEMP}/database-proof"
          go test -race -count=1 -v ./internal/migrate ./internal/storage ./internal/graphrag 2>&1 \
            | tee "${RUNNER_TEMP}/database-proof/sqlite.log"

      - name: upload SQLite proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: database-proof-sqlite-${{ github.sha }}
          path: ${{ runner.temp }}/database-proof/sqlite.log
          if-no-files-found: error
          retention-days: 14

  database-postgres-16:
    name: database proof · postgres-16
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: run PostgreSQL 16 migration lifecycle proof
        run: |
          mkdir -p "${RUNNER_TEMP}/database-proof"
          go test -race -count=1 -v -tags=integration -timeout=8m \
            -run '^TestPostgres16MigrationLifecycle$' ./internal/migrate 2>&1 \
            | tee "${RUNNER_TEMP}/database-proof/postgres-16.log"

      - name: upload PostgreSQL 16 proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: database-proof-postgres-16-${{ github.sha }}
          path: ${{ runner.temp }}/database-proof/postgres-16.log
          if-no-files-found: error
          retention-days: 14
