name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build · vet · test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race -timeout 180s ./...

      - name: loadsim build tag compiles
        run: go build -tags loadtest ./test/loadsim/...

      # The seven-day release gate is intentionally compile-and-unit-test only
      # in CI. Its full protocol runs for hours and terminates a local process.
      - name: prefill build tag compiles
        run: go build -tags prefill ./test/aggprefill/...

      - name: gate build tag compiles
        run: go build -tags gate ./test/gate/...

      - name: gate unit tests
        run: go test -tags gate -race -timeout 60s ./test/gate/...

  browser-smoke:
    name: browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build exact browser-test binary
        run: |
          mkdir -p "${RUNNER_TEMP}/browser-smoke"
          go build -o "${RUNNER_TEMP}/browser-smoke/otelcontext" .

      - name: run protected browser workflow
        env:
          OTELCONTEXT_BINARY: ${{ runner.temp }}/browser-smoke/otelcontext
          CHROME_BIN: google-chrome
          BROWSER_SMOKE_ARTIFACTS: ${{ runner.temp }}/browser-smoke/artifacts
        run: go test -tags=browser -count=1 -timeout 150s -run '^TestProtectedBrowserWorkflow$' ./test/browser

      - name: verify latency wording in the embedded client
        env:
          OTELCONTEXT_BINARY: ${{ runner.temp }}/browser-smoke/otelcontext
          OTELCONTEXT_BROWSER_CASE: latency
          CHROME_BIN: google-chrome
          BROWSER_SMOKE_ARTIFACTS: ${{ runner.temp }}/browser-smoke/artifacts
        run: go test -tags=browser -count=1 -timeout 150s -run '^TestLatencyLabels$' ./test/browser

      - name: upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/browser-smoke/artifacts
          if-no-files-found: warn
          retention-days: 14

  topology-proof:
    name: topology proof · ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, aggregate-shadow, aggregate]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: run cross-consumer topology proof
        env:
          OTELCONTEXT_TOPOLOGY_PROOF_MODE: ${{ matrix.mode }}
          OTELCONTEXT_TOPOLOGY_PROOF_DIR: ${{ runner.temp }}/topology-proof
        run: |
          set -o pipefail
          mkdir -p "${OTELCONTEXT_TOPOLOGY_PROOF_DIR}"
          go test -race -count=1 -v -run '^TestTopologyModeProof$' ./test/topologyproof 2>&1 \
            | tee "${OTELCONTEXT_TOPOLOGY_PROOF_DIR}/${OTELCONTEXT_TOPOLOGY_PROOF_MODE}.log"
          jq -e --arg mode "${OTELCONTEXT_TOPOLOGY_PROOF_MODE}" '
            .schema_version == "otelcontext.topology-proof.v1" and
            .mode == $mode and
            (.edge_set | length) == 1 and
            (.assertions | length) >= 10 and
            all(.assertions[]; .passed == true)
          ' "${OTELCONTEXT_TOPOLOGY_PROOF_DIR}/${OTELCONTEXT_TOPOLOGY_PROOF_MODE}.json"

      - name: upload mode topology proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: topology-proof-${{ matrix.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/topology-proof
          if-no-files-found: error
          retention-days: 14

  latency-proof:
    name: latency proof · ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, aggregate-shadow, aggregate]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: run contradictory-distribution latency proof
        env:
          OTELCONTEXT_LATENCY_PROOF_MODE: ${{ matrix.mode }}
          OTELCONTEXT_LATENCY_PROOF_DIR: ${{ runner.temp }}/latency-proof
        run: |
          set -o pipefail
          mkdir -p "${OTELCONTEXT_LATENCY_PROOF_DIR}"
          go test -race -count=1 -v -run '^TestLatencyModeProof$' ./test/topologyproof 2>&1 \
            | tee "${OTELCONTEXT_LATENCY_PROOF_DIR}/${OTELCONTEXT_LATENCY_PROOF_MODE}.log"
          jq -e --arg mode "${OTELCONTEXT_LATENCY_PROOF_MODE}" '
            .schema_version == "otelcontext.latency-contract.v1" and
            .mode == $mode and
            .sentinel.population == 1000 and
            .sentinel.nearest_rank_p99_ms == 1000 and
            .websocket_dashboard.unit == "microseconds" and
            (.ui_labels | length) == 7 and
            (.assertions | length) >= 11 and
            all(.assertions[]; .passed == true)
          ' "${OTELCONTEXT_LATENCY_PROOF_DIR}/${OTELCONTEXT_LATENCY_PROOF_MODE}.json"

      - name: upload mode latency proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: latency-contract-${{ matrix.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/latency-proof
          if-no-files-found: error
          retention-days: 14

  shutdown-proof:
    name: shutdown proof · ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, aggregate-shadow, aggregate]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build exact shutdown-proof binary
        run: |
          mkdir -p "${RUNNER_TEMP}/shutdown-proof"
          go build -trimpath -o "${RUNNER_TEMP}/shutdown-proof/otelcontext" .

      - name: run quiescence and restart proof
        env:
          OTELCONTEXT_SHUTDOWN_BINARY: ${{ runner.temp }}/shutdown-proof/otelcontext
          OTELCONTEXT_SHUTDOWN_PROOF_MODE: ${{ matrix.mode }}
          OTELCONTEXT_SHUTDOWN_PROOF_DIR: ${{ runner.temp }}/shutdown-proof/artifacts
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/shutdown-proof/artifacts"
          go test -tags=shutdownproof -count=1 -v -timeout=90s \
            -run '^TestShutdownModeProof$' ./test/shutdownproof 2>&1 \
            | tee "${RUNNER_TEMP}/shutdown-proof/artifacts/${OTELCONTEXT_SHUTDOWN_PROOF_MODE}-test.log"
          jq -e --arg mode "${OTELCONTEXT_SHUTDOWN_PROOF_MODE}" '
            .schema_version == "otelcontext.shutdown-proof.v1" and
            .mode == $mode and
            .first_exit_code == 0 and
            .restart_exit_code == 0 and
            .pre_restart_fingerprint == .post_restart_fingerprint and
            .dlq_before == .dlq_after and
            (.first_shutdown.steps | length) == 19 and
            (.restart_shutdown.steps | length) == 19 and
            all(.first_shutdown.steps[]; (.error // "") == "") and
            all(.restart_shutdown.steps[]; (.error // "") == "") and
            (.assertions | length) >= 10 and
            all(.assertions[]; .passed == true)
          ' "${RUNNER_TEMP}/shutdown-proof/artifacts/${OTELCONTEXT_SHUTDOWN_PROOF_MODE}.json"

      - name: upload mode shutdown proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shutdown-proof-${{ matrix.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/shutdown-proof/artifacts
          if-no-files-found: error
          retention-days: 14

  backup-proof:
    name: backup proof · ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, aggregate-shadow, aggregate]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build exact backup-proof binary
        run: |
          mkdir -p "${RUNNER_TEMP}/backup-proof"
          go build -trimpath -o "${RUNNER_TEMP}/backup-proof/otelcontext" .

      - name: run manifest-bound fresh-target restore proof
        env:
          OTELCONTEXT_SHUTDOWN_BINARY: ${{ runner.temp }}/backup-proof/otelcontext
          OTELCONTEXT_BACKUP_PROOF_MODE: ${{ matrix.mode }}
          OTELCONTEXT_BACKUP_PROOF_DIR: ${{ runner.temp }}/backup-proof/artifacts
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/backup-proof/artifacts"
          go test -tags=shutdownproof -count=1 -v -timeout=150s \
            -run '^TestBackupRestoreModeProof$' ./test/shutdownproof 2>&1 \
            | tee "${RUNNER_TEMP}/backup-proof/artifacts/${OTELCONTEXT_BACKUP_PROOF_MODE}-test.log"
          jq -e --arg mode "${OTELCONTEXT_BACKUP_PROOF_MODE}" '
            .schema_version == "otelcontext.backup-proof.v1" and
            .mode == $mode and
            .create.schema_version == "otelcontext.backup/v1" and
            .create.status == "created" and
            .restore.schema_version == "otelcontext.backup/v1" and
            .restore.status == "restored" and
            .restore.ready_seconds > 0 and
            .source_fingerprint == .target_fingerprint and
            .source_surfaces == .target_surfaces and
            .dlq_before == .dlq_after and
            (.source_surfaces.mcp_tools | length) == 7 and
            (.source_surfaces.mcp_calls | length) == 7 and
            (.assertions | length) >= 14 and
            all(.assertions[]; .passed == true)
          ' "${RUNNER_TEMP}/backup-proof/artifacts/${OTELCONTEXT_BACKUP_PROOF_MODE}.json"
          test -s "${RUNNER_TEMP}/backup-proof/artifacts/${OTELCONTEXT_BACKUP_PROOF_MODE}-manifest.json"

      - name: upload mode backup proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backup-proof-${{ matrix.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/backup-proof/artifacts
          if-no-files-found: error
          retention-days: 14

  database-backup-proof:
    name: database backup proof · ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: postgres-16
            adapter: postgres
          - profile: mysql-8.4
            adapter: mysql
          - profile: sqlserver-2022
            adapter: mssql
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: run native capture and fresh-target restore lifecycle
        env:
          OTELCONTEXT_BACKUP_ADAPTER: ${{ matrix.adapter }}
          OTELCONTEXT_NATIVE_BACKUP_PROOF_DIR: ${{ runner.temp }}/native-backup-proof
        run: |
          set -o pipefail
          mkdir -p "${OTELCONTEXT_NATIVE_BACKUP_PROOF_DIR}"
          go test -tags=integration -count=1 -v -timeout=22m \
            -run '^TestNativeBackupRestoreLifecycle$' ./internal/backup 2>&1 \
            | tee "${OTELCONTEXT_NATIVE_BACKUP_PROOF_DIR}/${OTELCONTEXT_BACKUP_ADAPTER}-test.log"
          jq -e --arg adapter "${OTELCONTEXT_BACKUP_ADAPTER}" '
            .schema_version == "otelcontext.native-backup-proof/v1" and
            .adapter == $adapter and
            .create.schema_version == "otelcontext.backup/v1" and
            .create.status == "created" and
            .restore.schema_version == "otelcontext.backup/v1" and
            .restore.status == "restored" and
            .source_lifecycle_fingerprint == .restored_lifecycle_fingerprint and
            (.assertions | length) >= 8 and
            all(.assertions[]; .passed == true)
          ' "${OTELCONTEXT_NATIVE_BACKUP_PROOF_DIR}/${OTELCONTEXT_BACKUP_ADAPTER}.json"
          test -s "${OTELCONTEXT_NATIVE_BACKUP_PROOF_DIR}/${OTELCONTEXT_BACKUP_ADAPTER}-manifest.json"

      - name: upload native database backup proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-backup-proof-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-backup-proof
          if-no-files-found: error
          retention-days: 14

  systemd-source-proof:
    name: systemd source proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v2.6.5'

      - name: install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26

      - name: build and sign release-shaped source archive
        run: |
          set -euo pipefail
          asset_dir="${RUNNER_TEMP}/systemd-source/assets"
          payload_dir="${RUNNER_TEMP}/systemd-source/payload"
          archive="${asset_dir}/otelcontext_source_linux_amd64.tar.gz"
          install -d -m 0755 "${asset_dir}" "${payload_dir}/deploy/systemd"
          go build -trimpath -o "${payload_dir}/otelcontext" .
          version_output="$("${payload_dir}/otelcontext" --version)"
          source_version="${version_output#OtelContext version }"
          test "${version_output}" = "OtelContext version ${source_version}"
          [[ "${source_version}" =~ ^[0-9A-Za-z._+-]+$ ]]
          install -m 0644 README.md LICENSE.md "${payload_dir}/"
          install -m 0644 deploy/systemd/otelcontext.service deploy/systemd/otelcontext.env.example \
            "${payload_dir}/deploy/systemd/"
          tar -C "${payload_dir}" -czf "${archive}" \
            otelcontext README.md LICENSE.md deploy/systemd/otelcontext.service deploy/systemd/otelcontext.env.example
          syft scan "${archive}" --output "spdx-json=${archive}.sbom.json"
          (
            cd "${asset_dir}"
            sha256sum "$(basename "${archive}")" "$(basename "${archive}").sbom.json" > checksums.txt
          )
          COSIGN_EXPERIMENTAL=1 cosign sign-blob --yes \
            --output-signature "${asset_dir}/checksums.txt.sig" \
            --output-certificate "${asset_dir}/checksums.txt.pem" \
            "${asset_dir}/checksums.txt"
          echo "SOURCE_ARCHIVE=${archive}" >> "${GITHUB_ENV}"
          echo "SOURCE_VERSION=${source_version}" >> "${GITHUB_ENV}"

      - name: download signed previous release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: v0.4.0-beta.2
        run: |
          set -euo pipefail
          previous_dir="${RUNNER_TEMP}/systemd-source/previous"
          previous_name="otelcontext_0.4.0-beta.2_linux_amd64.tar.gz"
          install -d -m 0755 "${previous_dir}"
          gh release download "${PREVIOUS_TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${previous_dir}" \
            --pattern "${previous_name}" \
            --pattern "${previous_name}.sbom.json" \
            --pattern checksums.txt \
            --pattern checksums.txt.sig \
            --pattern checksums.txt.pem
          echo "PREVIOUS_ARCHIVE=${previous_dir}/${previous_name}" >> "${GITHUB_ENV}"

      - name: start isolated Ubuntu systemd host
        run: |
          set -euo pipefail
          go_root="$(go env GOROOT)"
          cosign_path="$(command -v cosign)"
          docker run --detach --name otelcontext-systemd-proof \
            --privileged --cgroupns=private \
            --tmpfs /run --tmpfs /run/lock \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --volume "${RUNNER_TEMP}/systemd-source:/proof-input" \
            --volume "${go_root}:/usr/local/go:ro" \
            --volume "${cosign_path}:/usr/local/bin/cosign:ro" \
            ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517 \
            /bin/bash -c 'export DEBIAN_FRONTEND=noninteractive; apt-get update; apt-get install -y --no-install-recommends systemd systemd-sysv ca-certificates coreutils curl dbus findutils gawk grep gzip iproute2 jq openssl passwd sed tar util-linux; exec /sbin/init'
          ready=0
          for ((attempt = 0; attempt < 60; attempt++)); do
            state="$(docker inspect --format '{{.State.Status}}' otelcontext-systemd-proof)"
            if [[ "${state}" != "running" ]]; then
              docker logs otelcontext-systemd-proof
              exit 1
            fi
            system_state="$(docker exec otelcontext-systemd-proof systemctl is-system-running 2>/dev/null || true)"
            if [[ "${system_state}" == "running" || "${system_state}" == "degraded" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "${ready}" -ne 1 ]]; then
            docker logs otelcontext-systemd-proof
            exit 1
          fi
          docker exec otelcontext-systemd-proof systemd-analyze --version

      - name: run disposable production-shaped proof
        env:
          OTELCONTEXT_PROOF_SOURCE: "1"
          OTELCONTEXT_PROOF_CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
          OTELCONTEXT_PREVIOUS_TAG: v0.4.0-beta.2
        run: |
          set -euo pipefail
          proof_dir="${RUNNER_TEMP}/systemd-source/proof"
          docker exec \
            --env "PATH=/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            --env "SUDO_UID=$(id -u)" \
            --env "SUDO_GID=$(id -g)" \
            --env "OTELCONTEXT_PROOF_SOURCE=${OTELCONTEXT_PROOF_SOURCE}" \
            --env "OTELCONTEXT_PROOF_CERTIFICATE_IDENTITY=${OTELCONTEXT_PROOF_CERTIFICATE_IDENTITY}" \
            --env "OTELCONTEXT_PREVIOUS_ARCHIVE=/proof-input/previous/otelcontext_0.4.0-beta.2_linux_amd64.tar.gz" \
            --env "OTELCONTEXT_PREVIOUS_TAG=${OTELCONTEXT_PREVIOUS_TAG}" \
            --env "OTELCONTEXT_COSIGN=/usr/local/bin/cosign" \
            otelcontext-systemd-proof \
            /workspace/scripts/prove-systemd-release.sh \
              --archive "/proof-input/assets/$(basename "${SOURCE_ARCHIVE}")" \
              --tag "${SOURCE_VERSION}" \
              --sha "${GITHUB_SHA}" \
              --proof-dir "/proof-input/proof"
          jq -e --arg sha "${GITHUB_SHA}" '
            .schema_version == "otelcontext.systemd-proof.v1" and
            .sha == $sha and
            .source_proof == true and
            .certifying == false and
            .automatic_restarts == 1 and
            (.fingerprints | [.initial,.restart,.crash_recovery,.rollback,.upgrade] | unique | length) == 1 and
            all(.assertions[]; .passed == true)
          ' "${proof_dir}/systemd-proof-v1.json"

      - name: remove isolated systemd host
        if: ${{ always() }}
        run: |
          if docker inspect otelcontext-systemd-proof >/dev/null 2>&1; then
            docker rm --force otelcontext-systemd-proof
          fi

      - name: upload systemd diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: systemd-source-proof-${{ github.sha }}
          path: ${{ runner.temp }}/systemd-source/proof
          if-no-files-found: warn
          retention-days: 14
