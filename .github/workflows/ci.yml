name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Only obsolete PR runs cancel. Main and manual runs retain their exact-SHA result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build-and-test:
    name: build · vet · test
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit and fast storage regressions
        run: go test -count=1 -timeout 5m ./...
      - name: CI contract tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_*.py' -v

  main-validation:
    name: main validation
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build merged source
        run: go build -trimpath -o "${RUNNER_TEMP}/otelcontext" .
      - name: Migrate, start, check health, stop
        run: python3 scripts/smoke-startup.py "${RUNNER_TEMP}/otelcontext"
