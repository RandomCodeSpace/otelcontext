name: Release (artifacts + signing)

# Builds release artifacts and signs them when a version tag is pushed. The
# browser-native UI is committed under internal/ui/static and Go embeds it
# directly, so release jobs need only the Go toolchain.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build + sign (e.g. v0.3.1)'
        required: true

permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser (build · sbom · sign)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden runner egress
        # step-security/harden-runner v2.19.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout tag
        # actions/checkout v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go v6.2.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        # sigstore/cosign-installer v3.9.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          # Cosign v2 preserves the detached signature and certificate output
          # contract used by the GoReleaser configuration.
          cosign-release: 'v2.6.5'

      - name: Install syft
        # anchore/sbom-action v0.24.0
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610

      - name: Run GoReleaser
        # goreleaser/goreleaser-action v6.2.1
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: '~> v2'
          args: release --clean
        env:
          CGO_ENABLED: '0'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: '1'
