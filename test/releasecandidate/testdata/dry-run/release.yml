# Excerpt of .github/workflows/release.yml used by the manifest golden test.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  source-identity:
    name: source identity
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.13.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.5.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
  database-lifecycle-gate:
    name: database lifecycle gate
    uses: ./.github/workflows/database-proof.yml
