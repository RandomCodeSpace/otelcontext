apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otelcontext
resources:
  - namespace.yaml
  - otelcontext.yaml
  - prometheus.yaml
  - istio.yaml
configMapGenerator:
  - name: otelcontext-config
    envs:
      - otelcontext.env
  - name: prometheus-config
    files:
      - prometheus.yml
# Operator must replace both images with registry name + digest after building.
images:
  - name: otelcontext
    newName: registry.invalid/otelcontext
    newTag: operator-build-required
  - name: otelcontext-prometheus
    newName: registry.invalid/otelcontext-prometheus
    newTag: 3.15.0-go1.26.10-xnet0.60.0
