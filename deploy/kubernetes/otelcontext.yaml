apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otelcontext-data
spec:
  accessModes: [ReadWriteOncePod]
  # Replace with a CSI block-storage class supporting ReadWriteOncePod/fsGroup.
  storageClassName: replace-with-storage-class
  resources:
    requests:
      storage: 16Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelcontext
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otelcontext
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otelcontext
      annotations:
        # Ingress TLS is terminated at the gateway. No sidecar startup dependency.
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: otelcontext:operator-build-required
          args: [migrate, up]
          envFrom:
            - configMapRef:
                name: otelcontext-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "3", memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/otelcontext}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: otelcontext
          image: otelcontext:operator-build-required
          envFrom:
            - configMapRef:
                name: otelcontext-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: "3", memory: 6Gi}
            limits: {cpu: "3", memory: 6Gi}
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc-otlp, containerPort: 4317}
          # Startup proves process availability. Saturation must not restart it.
          startupProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/otelcontext}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otelcontext-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: otelcontext
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otelcontext
  ports:
    - {name: http-api, port: 8080, targetPort: http, appProtocol: http}
    - {name: http-otlp, port: 4318, targetPort: http, appProtocol: http}
    - {name: grpc-otlp, port: 4317, targetPort: grpc-otlp, appProtocol: grpc}
